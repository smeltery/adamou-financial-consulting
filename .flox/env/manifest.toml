schema-version = "1.18.0"
[install]
bun.pkg-path = "bun"
bun.version = "1.3.11"
git.pkg-path = "git"
git.outputs = "all"
actionlint.pkg-path = "actionlint"
nodejs.pkg-path = "nodejs"
nodejs.version = "24"
[hook]
on-activate = '''
  git config core.hooksPath .githooks
'''
[services.preview]
command = "bun run dev"
[services.console]
command = "bun run dev:console"
[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
