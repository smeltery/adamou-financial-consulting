name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Verified tag to release
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  publish:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4
        with:
          version: 1.18.1
      - name: Verify and build
        run: flox activate -- bash -c 'bun install --frozen-lockfile && bunx --bun playwright install --with-deps chromium && ./scripts/check.sh'
      - name: Package static site
        run: |
          cp LICENSE dist/LICENSE
          tar -czf afin-site.tar.gz -C dist .
          sha256sum afin-site.tar.gz > afin-site.tar.gz.sha256
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            afin-site.tar.gz
            afin-site.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
